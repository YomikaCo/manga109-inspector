<!doctype html>
<html lang="en" data-ready="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta id="theme-color-meta" name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A local-first Manga109 image and annotation inspector. Files stay on this device."
    />
    <title>Manga109 Inspector</title>
    <script>
      (function () {
        const root = document.documentElement;
        const colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');
        const themeColorMeta = document.getElementById("theme-color-meta");
        let theme = localStorage.getItem("theme");
        if (!theme) theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        root.dataset.theme = theme;
        if (colorSchemeMeta) colorSchemeMeta.content = theme;
        if (themeColorMeta) themeColorMeta.content = theme === "dark" ? "#09090b" : "#ffffff";
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>This application requires JavaScript.</noscript>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
